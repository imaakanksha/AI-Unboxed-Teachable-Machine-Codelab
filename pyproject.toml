[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "teachable_machine"
version = "0.1.0"
description = "A professional, production-ready inference, patching, and evaluation library for Google Teachable Machine models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "DeepMind Teachable Machine Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20.0",
    "pillow>=9.0.0",
    "h5py>=3.0.0",
    "click>=8.0.0",
    "rich>=12.0.0",
    "tabulate>=0.9.0",
    "tensorflow>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
teachable-tm = "teachable_machine.cli:main"
